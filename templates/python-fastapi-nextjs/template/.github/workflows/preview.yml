name: Preview environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Browser screenshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the frontend
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Start the frontend
        working-directory: frontend
        run: |
          npm start > /tmp/flywheel-frontend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/flywheel-frontend.log
          exit 1

      - name: Install Playwright
        run: npm init -y && npm i -D @playwright/test && npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: |
          mkdir -p screenshots
          cat > shot.spec.ts <<'SPEC'
          import { test, expect } from '@playwright/test';
          test('home page renders', async ({ page }) => {
            await page.goto('http://127.0.0.1:3000', { waitUntil: 'networkidle' });
            await expect(page.locator('body')).toBeVisible();
            await page.screenshot({ path: 'screenshots/home.png', fullPage: true });
          });
          SPEC
          npx playwright test shot.spec.ts --reporter=list

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error

  deploy:
    name: Docker preview deployment
    if: ${{ vars.DOMAIN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
      deployments: write
    environment:
      name: dev
      url: https://pr-${{ github.event.pull_request.number }}.dev.${{ vars.DOMAIN }}
    env:
      REGISTRY: ghcr.io
      STACK: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize the container repository
        id: image
        shell: bash
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.repository }}/api:${{ env.STACK }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://pr-${{ github.event.pull_request.number }}-api.dev.${{ vars.DOMAIN }}
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.repository }}/web:${{ env.STACK }}

      - name: Deploy to the Docker host
        uses: appleboy/ssh-action@v1
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          envs: STACK,REGISTRY,REPOSITORY
          script: |
            set -e
            export STACK=${{ env.STACK }}
            export IMAGE_TAG=${{ env.STACK }}
            export DOMAIN=${{ vars.DOMAIN }}
            export SUBDOMAIN=pr-${{ github.event.pull_request.number }}.dev
            export ENVIRONMENT=dev
            mkdir -p ~/stacks/$STACK
            cd ~/stacks/$STACK
            curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o docker-compose.deploy.yml \
              https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/docker-compose.deploy.yml
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker compose -p $STACK -f docker-compose.deploy.yml pull
            docker compose -p $STACK -f docker-compose.deploy.yml up -d --remove-orphans

      - name: Wait for the preview to answer
        run: |
          url="https://pr-${{ github.event.pull_request.number }}.dev.${{ vars.DOMAIN }}"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "$url" > /dev/null; then
              echo "preview is up"; exit 0
            fi
            echo "attempt $attempt: not ready yet"; sleep 10
          done
          echo "preview did not become reachable"; exit 1
