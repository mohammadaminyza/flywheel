name: Preview environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  STACK: pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
      deployments: write
    environment:
      name: dev
      url: https://pr-${{ github.event.pull_request.number }}.dev.${{ vars.DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ env.STACK }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://pr-${{ github.event.pull_request.number }}-api.dev.${{ vars.DOMAIN }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ env.STACK }}

      - name: Deploy to the Docker host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          envs: STACK,REGISTRY
          script: |
            set -e
            export STACK=${{ env.STACK }}
            export IMAGE_TAG=${{ env.STACK }}
            export DOMAIN=${{ vars.DOMAIN }}
            export SUBDOMAIN=pr-${{ github.event.pull_request.number }}.dev
            export ENVIRONMENT=dev
            mkdir -p ~/stacks/$STACK
            cd ~/stacks/$STACK
            curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o docker-compose.deploy.yml \
              https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/docker-compose.deploy.yml
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker compose -p $STACK -f docker-compose.deploy.yml pull
            docker compose -p $STACK -f docker-compose.deploy.yml up -d --remove-orphans

      - name: Wait for the preview to answer
        run: |
          url="https://pr-${{ github.event.pull_request.number }}.dev.${{ vars.DOMAIN }}"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "$url" > /dev/null; then
              echo "preview is up"; exit 0
            fi
            echo "attempt $attempt: not ready yet"; sleep 10
          done
          echo "preview did not become reachable"; exit 1

      - name: Install Playwright
        run: npm init -y && npm i -D @playwright/test && npx playwright install --with-deps chromium

      - name: Capture screenshots
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.dev.${{ vars.DOMAIN }}
        run: |
          mkdir -p screenshots
          cat > shot.spec.ts <<'SPEC'
          import { test, expect } from '@playwright/test';
          const url = process.env.PREVIEW_URL!;
          test('home page renders', async ({ page }) => {
            await page.goto(url, { waitUntil: 'networkidle' });
            await expect(page.locator('body')).toBeVisible();
            await page.screenshot({ path: 'screenshots/home.png', fullPage: true });
          });
          SPEC
          npx playwright test shot.spec.ts --reporter=list || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Comment the preview link on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://pr-${{ github.event.pull_request.number }}.dev.${{ vars.DOMAIN }}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Preview environment\n\n${url}\n\nScreenshots are attached to [the workflow run](${run}).`
            });
