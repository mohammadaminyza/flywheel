[project]
name = "flywheel"
version = "0.1.0"
description = "Autonomous software factory: reads a GitHub Projects board, dispatches tasks to Claude Code or Codex, ships reviewed PRs with live preview environments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "rich>=13.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "httpx>=0.28",
    "mcp>=1.2",
    "copier>=9.4",
    "pyyaml>=6.0",
    "tomlkit>=0.13",
    "platformdirs>=4.3",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "paramiko>=3.4",
    "pynacl>=1.5",
]

[project.scripts]
flywheel = "flywheel.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flywheel"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["copier.*", "mcp.*", "paramiko.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
